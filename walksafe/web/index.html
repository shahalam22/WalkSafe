<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>WalkSafe</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <h1>WalkSafe</h1>
    <button id="toggle" class="primary" aria-describedby="status">Start guidance</button>

    <!-- What WalkSafe sees, for a sighted helper: the camera and the annotated panel. -->
    <section id="views" class="views" aria-hidden="true">
      <video id="camera" playsinline muted></video>
      <img id="annotated" alt="">
    </section>
    <p id="command" class="command" aria-hidden="true"></p>

    <p id="status" role="status" aria-live="polite">Ready. Use WalkSafe alongside your cane.</p>

    <section id="setup" hidden aria-labelledby="setup-question">
      <p id="setup-question"></p>
      <div id="setup-choices" class="choices"></div>
    </section>

    <section aria-label="Settings" class="settings">
      <label>Mode
        <select id="mode">
          <option value="simple">Simple (like the prototype)</option>
          <option value="full">Full safety (levels, phone stop, late answers dropped)</option>
        </select>
      </label>
      <button id="mute" aria-pressed="false">Mute guidance</button>
      <label>Detail
        <select id="verbosity">
          <option value="brief">Brief</option>
          <option value="normal">Normal</option>
          <option value="detailed">Detailed</option>
        </select>
      </label>
      <label>Speech rate
        <input id="rate" type="range" min="0.5" max="2" step="0.1" value="1">
      </label>
      <label class="check"><input id="views-on" type="checkbox" checked> Show camera views</label>
      <button id="redo-setup">Run setup (optional)</button>
    </section>

    <p id="debug" aria-hidden="true"></p>
  </main>
  <script type="module" src="js/main.js"></script>
</body>
</html>
